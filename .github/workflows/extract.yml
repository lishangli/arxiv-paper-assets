name: Extract arXiv figures
on:
  push:
    paths:
      - 'scripts/extract.py'
      - '.github/workflows/extract.yml'
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: "arXiv paper ID"
        required: true
        default: "2610.21312"
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract
        run: python scripts/extract.py "${{ inputs.arxiv_id || '2610.20981' }}"
      - name: Commit original figure assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Extract arXiv figures for ${{ inputs.arxiv_id || '2610.20981' }}"
            git push
          fi
